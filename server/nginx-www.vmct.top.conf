server {
    listen 80;
    listen [::]:80;
    server_name www.vmct.top;

    # Optional VMPM download routes; owned and maintained by the VMPM deployer.
    include /etc/nginx/conf.d/www-public-downloads.in[c];

    location /api/ {
        proxy_pass http://172.17.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
        proxy_no_cache 1;
    }

    location = /search {
        proxy_pass http://172.17.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_no_cache 1;
    }

    # HTML is rendered from the current publication; assets remain static.
    location ^~ /admin {
        proxy_pass http://172.17.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_no_cache 1;
    }

    location = / {
        proxy_pass http://172.17.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_no_cache 1;
    }

    location = /sitemap.xml {
        proxy_pass http://172.17.0.1:8787;
        proxy_set_header Host $host;
    }

    location = /index.html {
        return 308 /;
    }

    location ~ ^/(server|src|node_modules|internal|\.git|\.vite)(/|$) {
        return 404;
    }

    location / {
        root /home/vmct/vmpm/dist/www.vmct.top;
        try_files $uri @vmct_site;
    }

    location @vmct_site {
        proxy_pass http://172.17.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_no_cache 1;
    }

    location /assets/ {
        root /home/vmct/vmpm/dist/www.vmct.top;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
