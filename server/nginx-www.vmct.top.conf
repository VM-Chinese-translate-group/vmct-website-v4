server {
    listen 80;
    listen [::]:80;
    server_name www.vmct.top;

    location /api/ {
        proxy_pass http://172.17.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
        proxy_no_cache 1;
    }

    location = /search {
        proxy_pass http://172.17.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_no_cache 1;
    }

    # The static frontend is served by the companion Nginx container on the
    # ECS host. Keeping this as a proxy lets the existing edge Nginx retain
    # control of the www.vmct.top virtual host without touching other sites.
    location / {
        proxy_pass http://172.17.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
